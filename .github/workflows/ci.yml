name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./macos/build.sh
        env:
          SIGN_IDENTITY: "-"
          INSTALL: "0"
      - name: Smoke test
        run: ./macos/smoke-test.sh
        timeout-minutes: 20

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Self-test
        run: python windows/laf.pyw --selftest
