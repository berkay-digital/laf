<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="After you correct cloud to Claude once, Laf saves Claude, heard as cloud. Then ask cloud to fix the failing tests becomes Ask Claude to fix the failing tests, while then upload the build to the cloud keeps the word cloud.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC53D"/>
      <stop offset="1" stop-color="#E09A12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC53D" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#2A2D35"/>
      <stop offset="1" stop-color="#E09A12" stop-opacity="0.55"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .label { font-size: 12px; font-weight: 600; letter-spacing: 1.4px; fill: #8B919E; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #E6E7EB; }
      .key { fill: #FFC53D; }
      .raw { font-size: 17px; font-style: italic; fill: #A9AEB9; }
      .out { font-size: 17px; font-weight: 500; fill: #F1EBE1; }
      .hit { fill: #FFC53D; font-weight: 700; }
      .kept { fill: #7DD3A8; font-weight: 700; }
      .note { font-size: 13px; fill: #8B919E; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="298" rx="18" fill="#0D1015" stroke="url(#edge)" stroke-width="2"/>

  <text x="40" y="50" class="label">YOU FIX "cloud" TO "Claude" ONCE. LAF SAVES:</text>
  <rect x="40" y="66" width="560" height="40" rx="10" fill="#181B22" stroke="#2A2D35"/>
  <text x="58" y="91" class="mono"><tspan class="key">Claude</tspan> · Anthropic's AI assistant · heard as "cloud"</text>

  <text x="40" y="148" class="label">NEXT TIME, IT READS THE SENTENCE</text>

  <rect x="40" y="164" width="820" height="48" rx="10" fill="#181B22"/>
  <text x="60" y="194" class="raw">ask cloud to fix the failing tests</text>
  <path d="M392 188 H418 M410 181 L418 188 L410 195" stroke="url(#brand)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="194" class="out">Ask <tspan class="hit">Claude</tspan> to fix the failing tests</text>
  <text x="844" y="194" class="note" text-anchor="end">changed</text>

  <rect x="40" y="222" width="820" height="48" rx="10" fill="#181B22"/>
  <text x="60" y="252" class="raw">then upload the build to the cloud</text>
  <path d="M392 246 H418 M410 239 L418 246 L410 253" stroke="url(#brand)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="252" class="out">Then upload the build to the <tspan class="kept">cloud</tspan>.</text>
  <text x="844" y="252" class="note" text-anchor="end">kept</text>
</svg>
