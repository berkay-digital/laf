<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="You say: um so two things first update the readme no wait first bump the version and then update the readme. Laf types into Slack: So, two things: 1. Bump the version. 2. Update the README.">
  <defs>
